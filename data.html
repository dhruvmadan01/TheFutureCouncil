<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TFC CRM | The Future Council</title>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <link rel="icon" href="TFC.png" type="image/png" />
  <link rel="apple-touch-icon" href="TFC.png" />
  <meta name="theme-color" content="#14110F" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --ink: #14110F; --soft: #6B645C; --faint: #A39B90;
      --bg: #FAF7F2; --card: #FFFFFF; --line: #E9E3D9; --wash: #F3EEE6;
      --orange: #E2542A; --orange-wash: #FDEDE6;
      --green: #15803D; --green-wash: #E8F6EC;
      --amber: #B45309; --amber-wash: #FEF3E2;
      --blue: #1D4ED8; --blue-wash: #E8EFFE;
      --red: #B91C1C; --red-wash: #FDECEC;
      --violet: #6D28D9; --violet-wash: #F1EAFD;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.45; }
    h1, h2, h3 { font-family: 'Bricolage Grotesque', 'Instrument Sans', sans-serif; margin: 0; letter-spacing: -0.02em; }
    button, input, select, textarea { font: inherit; color: inherit; }
    .hidden { display: none !important; }
    a { color: inherit; }

    /* Login */
    .login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    .login-card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 28px; box-shadow: 0 10px 40px rgba(20,17,15,.06); }
    .login-card img { width: 44px; height: 44px; border-radius: 10px; }
    .login-card h1 { font-size: 26px; margin: 14px 0 4px; }
    .login-card p { color: var(--soft); margin: 0 0 18px; font-size: 14px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .field label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--soft); }
    .in { width: 100%; padding: 11px 13px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; font-size: 16px; }
    .in:focus { outline: none; border-color: var(--ink); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border-radius: 10px; border: 1.5px solid var(--ink); background: var(--ink); color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: none; white-space: nowrap; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
    .btn.ghost:hover { border-color: var(--ink); }
    .btn.orange { background: var(--orange); border-color: var(--orange); }
    .btn.sm { padding: 7px 12px; font-size: 13px; }
    .btn.block { width: 100%; }
    .err { background: var(--red-wash); color: var(--red); border: 1px solid #F5C2C2; border-radius: 10px; padding: 10px 12px; font-size: 13px; font-weight: 600; margin-bottom: 12px; }

    /* Shell */
    .top { position: sticky; top: 0; z-index: 30; background: var(--ink); color: #fff; }
    .top-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px; }
    .brand { display: flex; align-items: center; gap: 9px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; letter-spacing: -.01em; text-decoration: none; }
    .brand img { width: 28px; height: 28px; border-radius: 7px; }
    .brand small { font-family: 'Instrument Sans', sans-serif; font-weight: 700; font-size: 11px; background: var(--orange); border-radius: 99px; padding: 2px 8px; letter-spacing: .04em; }
    .spacer { flex: 1; }
    .who { font-size: 13px; color: #D9D2C7; display: flex; align-items: center; gap: 10px; }
    .who b { color: #fff; }
    .top .btn.ghost { color: #fff; border-color: #44403C; }
    .tabs { background: var(--ink); border-top: 1px solid #2A2622; }
    .tabs-in { max-width: 1240px; margin: 0 auto; padding: 0 12px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
    .tabs-in::-webkit-scrollbar { display: none; }
    .tab { background: none; border: none; color: #A8A094; padding: 11px 14px; font-weight: 700; font-size: 14px; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; display: flex; gap: 7px; align-items: center; }
    .tab.on { color: #fff; border-bottom-color: var(--orange); }
    .tab .n { font-size: 11px; background: #2F2A26; border-radius: 99px; padding: 1px 7px; color: #D9D2C7; }
    .tab.on .n { background: var(--orange); color: #fff; }
    main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 80px; }
    .page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .page-h h2 { font-size: clamp(24px, 4vw, 32px); }
    .page-h p { margin: 4px 0 0; color: var(--soft); font-size: 14px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }

    /* Cards, stats */
    .grid { display: grid; gap: 12px; }
    .stats { grid-template-columns: repeat(2, 1fr); margin-bottom: 18px; }
    @media (min-width: 720px) { .stats { grid-template-columns: repeat(4, 1fr); } }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
    .stat b { display: block; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; line-height: 1.1; }
    .stat span { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--soft); }
    .stat small { display: block; color: var(--faint); font-size: 12px; margin-top: 2px; }
    .stat.hot b { color: var(--orange); }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    .panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
    .panel-h h3 { font-size: 16px; }
    .two { grid-template-columns: 1fr; }
    @media (min-width: 900px) { .two { grid-template-columns: 1fr 1fr; } }
    .empty { padding: 28px 16px; text-align: center; color: var(--faint); font-size: 14px; }

    /* Controls */
    .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
    .bar .in { max-width: 320px; padding: 9px 12px; font-size: 15px; }
    .seg { display: inline-flex; background: var(--wash); border-radius: 10px; padding: 3px; }
    .seg button { border: none; background: none; padding: 7px 13px; border-radius: 8px; font-weight: 700; font-size: 13px; color: var(--soft); cursor: pointer; }
    .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .fchip { border: 1.5px solid var(--line); background: #fff; border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 700; color: var(--soft); cursor: pointer; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
    .fchip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
    .fchip i { font-style: normal; font-size: 11px; opacity: .75; }
    .seats { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .seats .track { flex: 1; min-width: 140px; height: 8px; background: var(--wash); border-radius: 99px; overflow: hidden; }
    .seats .fill { height: 100%; background: var(--orange); border-radius: 99px; }

    /* Rows */
    .rows { display: flex; flex-direction: column; }
    .row { display: grid; grid-template-columns: 38px 1fr; gap: 12px; align-items: center; padding: 12px 16px; border: none; border-bottom: 1px solid var(--line); background: var(--card); text-align: left; width: 100%; cursor: pointer; }
    .row:last-child { border-bottom: none; }
    .row:hover { background: #FDFBF7; }
    .panel > .rows > .row:first-child { border-top: none; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--wash); display: grid; place-items: center; font-weight: 800; font-size: 14px; color: var(--soft); }
    .nm { font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .sub { color: var(--soft); font-size: 13px; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
    .ago { color: var(--faint); font-size: 12px; }
    @media (min-width: 900px) {
      .row { grid-template-columns: 38px minmax(0,1.6fr) minmax(0,1.2fr); }
      .meta { margin-top: 0; justify-content: flex-end; }
    }
    .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 99px; background: var(--wash); color: var(--soft); white-space: nowrap; }
    .pill.green { background: var(--green-wash); color: var(--green); }
    .pill.amber { background: var(--amber-wash); color: var(--amber); }
    .pill.blue { background: var(--blue-wash); color: var(--blue); }
    .pill.red { background: var(--red-wash); color: var(--red); }
    .pill.orange { background: var(--orange-wash); color: var(--orange); }
    .pill.violet { background: var(--violet-wash); color: var(--violet); }

    /* Chapter cards */
    .cards { grid-template-columns: 1fr; }
    @media (min-width: 640px) { .cards { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1000px) { .cards { grid-template-columns: repeat(3, 1fr); } }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
    .card h3 { font-size: 16px; margin-bottom: 2px; }
    .card p { margin: 6px 0 0; color: var(--soft); font-size: 13px; }
    .section-t { font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 800; margin: 24px 0 10px; }

    /* Drawer */
    .scrim { position: fixed; inset: 0; background: rgba(20,17,15,.45); z-index: 50; }
    .drawer { position: fixed; z-index: 60; background: var(--bg); display: flex; flex-direction: column; inset: 0; }
    @media (min-width: 900px) { .drawer { inset: 0 0 0 auto; width: 520px; box-shadow: -10px 0 40px rgba(0,0,0,.15); } }
    .d-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 16px; background: #fff; border-bottom: 1px solid var(--line); }
    .d-h h2 { font-size: 22px; }
    .d-b { overflow-y: auto; padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 14px; padding-bottom: 60px; }
    .x { border: none; background: var(--wash); border-radius: 50%; width: 36px; height: 36px; cursor: pointer; font-size: 18px; flex-shrink: 0; }
    .blk { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
    .blk h4 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--soft); }
    .kv { display: grid; grid-template-columns: 112px 1fr; gap: 6px 10px; font-size: 14px; }
    .kv dt { color: var(--soft); }
    .kv dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
    .kv a { color: var(--blue); }
    .contact { display: flex; gap: 8px; flex-wrap: wrap; }
    .stagepick { display: flex; gap: 6px; flex-wrap: wrap; }
    .stagepick button { border: 1.5px solid var(--line); background: #fff; border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--soft); }
    .stagepick button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
    .stagepick button:disabled { opacity: .4; cursor: not-allowed; }
    .stars { display: flex; gap: 4px; }
    .stars button { border: none; background: none; font-size: 24px; cursor: pointer; color: #D6CFC3; padding: 0 2px; }
    .stars button.on { color: var(--orange); }
    .notes { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .note { background: var(--wash); border-radius: 10px; padding: 8px 11px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .note small { display: block; color: var(--soft); font-size: 12px; margin-bottom: 2px; }
    textarea.in { min-height: 70px; resize: vertical; }
    .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 12px; font-weight: 600; font-size: 14px; z-index: 100; max-width: 92vw; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
    .toast.bad { background: var(--red); }
    .foot { text-align: center; color: var(--faint); font-size: 13px; margin-top: 30px; }
    .foot a { color: var(--soft); }
    .loading { padding: 60px 16px; text-align: center; color: var(--soft); }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="loginView">
  <form class="login-card" id="loginForm" autocomplete="on">
    <img src="TFC.png" alt="TFC" />
    <h1>TFC CRM</h1>
    <p>Team sign-in. Authorised staff only.</p>
    <div class="err hidden" id="loginErr">Incorrect ID or password.</div>
    <div class="field"><label for="lu">ID</label><input class="in" id="lu" autocomplete="username" autocapitalize="none" required /></div>
    <div class="field"><label for="lp">Password</label><input class="in" id="lp" type="password" autocomplete="current-password" required /></div>
    <button class="btn block orange" type="submit">Sign in</button>
  </form>
</div>

<!-- APP -->
<div class="hidden" id="appView">
  <header class="top">
    <div class="top-in">
      <a class="brand" href="/"><img src="TFC.png" alt="" /> TFC <small>CRM</small></a>
      <div class="spacer"></div>
      <div class="who"><span id="whoLabel"></span><button class="btn ghost sm" id="btnRefresh" title="Reload data">↻</button><button class="btn ghost sm" id="btnLogout">Log out</button></div>
    </div>
    <nav class="tabs"><div class="tabs-in" id="tabs"></div></nav>
  </header>
  <main id="view"><div class="loading">Loading…</div></main>
</div>

<div id="overlay"></div>
<div id="toastHost"></div>

<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------ *
   * Config
   * ------------------------------------------------------------------ */
  const SB_URL = 'https://fwwbybbjvchrhozzzigp.supabase.co';
  const SB_KEY = 'sb_publishable_f5qK_eS6qXGm5I7Em59aPQ_HvEH45h5';
  const SEATS = 20;
  const SESSION_KEY = 'tfc_crm2_session';

  // Staff accounts. Passwords are stored only as salted SHA-256 hashes.
  // Add or change a person with:  node scripts/crm-staff.js <id> <role> "<Display name>" "<password>"
  // Roles: admin | manager | intern.   NOTE: this gate is a front-end convenience, see README note in scripts/crm-staff.js.
  const STAFF = [
    { u: 'admin', role: 'admin', name: 'Admin', hash: 'c77e75e8aaf44a3ff6a727fb919bbbef61e9e24ba90b48e22531653d61773a88' },
    { u: 'brahmleen', role: 'manager', name: 'Brahmleen', hash: '982eb5d9e06e86d9c32bfc180556a299dfa85f13bc8ba74ee98054dd31f80af0', alias: ['brahmleen1314@gmail.com'] }
  ];

  const PERMS = {
    admin:   { export: true,  verify: true,  decide: true,  payments: true },
    manager: { export: true,  verify: true,  decide: true,  payments: true },
    intern:  { export: false, verify: false, decide: false, payments: false }
  };

  const sb = (window.supabase && window.supabase.createClient) ? window.supabase.createClient(SB_URL, SB_KEY) : null;

  /* ------------------------------------------------------------------ *
   * Stage definitions per record type. "decide" stages need the decide permission.
   * ------------------------------------------------------------------ */
  const STAGES = {
    application: [
      { k: 'incomplete', label: 'Incomplete', tone: '' },
      { k: 'applied', label: 'Applied', tone: 'blue' },
      { k: 'review', label: 'In review', tone: 'amber' },
      { k: 'shortlisted', label: 'Shortlisted', tone: 'violet' },
      { k: 'selected', label: 'Selected', tone: 'green', decide: true },
      { k: 'rejected', label: 'Not selected', tone: 'red', decide: true }
    ],
    chapterlead: [
      { k: 'new', label: 'New', tone: 'blue' },
      { k: 'contacted', label: 'Contacted', tone: 'amber' },
      { k: 'interview', label: 'Interview', tone: 'violet' },
      { k: 'approved', label: 'Approved', tone: 'green', decide: true },
      { k: 'declined', label: 'Declined', tone: 'red', decide: true }
    ],
    investor: [
      { k: 'new', label: 'New', tone: 'blue' },
      { k: 'contacted', label: 'Contacted', tone: 'amber' },
      { k: 'talking', label: 'In conversation', tone: 'violet' },
      { k: 'active', label: 'Active', tone: 'green' },
      { k: 'declined', label: 'Not a fit', tone: 'red' }
    ],
    mentor: [
      { k: 'new', label: 'New', tone: 'blue' },
      { k: 'contacted', label: 'Contacted', tone: 'amber' },
      { k: 'onboarded', label: 'Onboarded', tone: 'green' },
      { k: 'declined', label: 'Not a fit', tone: 'red' }
    ],
    ambassador: [
      { k: 'new', label: 'New', tone: 'blue' },
      { k: 'contacted', label: 'Contacted', tone: 'amber' },
      { k: 'active', label: 'Active', tone: 'green' },
      { k: 'closed', label: 'Closed', tone: '' }
    ],
    lead: [
      { k: 'new', label: 'New', tone: 'blue' },
      { k: 'contacted', label: 'Contacted', tone: 'amber' },
      { k: 'active', label: 'Active', tone: 'green' },
      { k: 'closed', label: 'Closed', tone: '' }
    ]
  };
  const TYPE_LABEL = { application: 'Applicant', chapterlead: 'Chapter lead', investor: 'Investor', mentor: 'Mentor', ambassador: 'Ambassador', lead: 'Lead' };

  /* ------------------------------------------------------------------ *
   * State
   * ------------------------------------------------------------------ */
  const S = {
    user: null, perms: PERMS.intern,
    tab: 'overview',
    records: [], chapters: [], loaded: false, loadError: null,
    app: { cohort: 'Spring02', stage: 'all', q: '', sort: 'new' },
    chap: { q: '', stage: 'all' },
    net: { kind: 'investor', stage: 'all', q: '' },
    people: { type: 'all', q: '' },
    openId: null
  };

  /* ------------------------------------------------------------------ *
   * Helpers
   * ------------------------------------------------------------------ */
  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const initials = (n) => (String(n || '?').trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('') || '?').toUpperCase();
  const clean = (v) => { const s = String(v == null ? '' : v).trim(); return (s === 'None' || s === 'Pending' || s === 'N/A') ? '' : s; };

  function toast(msg, bad) {
    const t = document.createElement('div');
    t.className = 'toast' + (bad ? ' bad' : '');
    t.textContent = msg;
    $('toastHost').appendChild(t);
    setTimeout(() => t.remove(), bad ? 6000 : 2200);
  }

  function ago(iso) {
    const d = new Date(iso);
    if (!iso || isNaN(d)) return '';
    const s = Math.round((Date.now() - d) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    if (s < 86400 * 30) return Math.floor(s / 86400) + 'd ago';
    return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
  }

  async function sha256(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
  }

  function phoneDigits(p) {
    const d = String(p || '').replace(/\D/g, '');
    if (d.length === 10) return '91' + d;
    if (d.length === 12 && d.startsWith('91')) return d;
    return d.length >= 10 ? d : '';
  }
  const waLink = (p, msg) => { const d = phoneDigits(p); return d ? 'https://wa.me/' + d + (msg ? '?text=' + encodeURIComponent(msg) : '') : ''; };
  const first = (n) => String(n || '').trim().split(/\s+/)[0] || 'there';

  /* ------------------------------------------------------------------ *
   * Parsing the pipe-delimited "college" column into a clean record
   * ------------------------------------------------------------------ */
  function parseMember(m) {
    const raw = m.college || '';
    const parts = raw.split(' | ');
    const kv = {};
    parts.slice(1).forEach((p) => {
      const i = p.indexOf(':');
      if (i > 0) {
        const key = p.slice(0, i).trim();
        if (/^[A-Za-z0-9_ ]{1,30}$/.test(key)) kv[key.toLowerCase().replace(/\s+/g, '')] = p.slice(i + 1).trim();
      }
    });
    const id = m.member_id || '';
    const src = kv.source || '';
    let type = 'lead';
    if (src === 'FellowshipPage' || id.startsWith('TFC-FEL-') || kv.fellowship === 'Yes') type = 'application';
    else if (m.tier === 'Investor' || src === 'InvestorPage' || id.startsWith('TFC-INV-')) type = 'investor';
    else if (m.tier === 'Mentor' || src === 'MentorPage' || id.startsWith('TFC-MTR-')) type = 'mentor';
    else if (kv.role === 'ChapterLeadApplicant' || id.startsWith('TFC-LEAD-') || m.tier === 'Ambassador') type = 'chapterlead';
    else if (m.tier === 'Campus Ambassador' || src === 'AmbassadorPage' || id.startsWith('TFC-AMB-')) type = 'ambassador';

    const display = (parts[0] || '').trim();
    const rec = {
      id: m.id, memberId: id, name: (m.name || '').trim() || 'Unnamed', email: (m.email || '').trim(), tier: m.tier || '',
      raw, kv, type, display: display === 'Ecosystem Member' ? '' : display,
      phone: clean(kv.phone) || clean(m.phone),
      created: m.created_at || kv.formsubmittedat || kv.submittedat || ''
    };
    rec.cohort = type === 'application' ? (kv.cohort || 'Winter01') : '';
    rec.stage = stageOf(rec);
    rec.score = parseInt(kv.crmscore, 10) || 0;
    rec.owner = kv.crmowner ? decodeSafe(kv.crmowner) : '';
    rec.notes = kv.crmnote ? decodeSafe(kv.crmnote).split('\n').filter(Boolean) : [];
    rec.payment = paymentOf(rec);
    rec.updated = kv.crmupdated || '';
    rec.updatedBy = kv.crmby ? decodeSafe(kv.crmby) : '';
    rec.hadWinter = !!kv.prevcohort01;
    return rec;
  }
  function decodeSafe(v) { try { return decodeURIComponent(v); } catch (e) { return v; } }

  function paymentOf(r) {
    if (r.type !== 'application') return '';
    const ps = (r.kv.paymentstatus || '').toLowerCase();
    if (ps === 'verified') return 'verified';
    if (r.kv.payment === 'Paid' || ps === 'pending_verification') return 'claimed';
    return 'none';
  }

  function stageOf(r) {
    const list = STAGES[r.type] || STAGES.lead;
    const saved = r.kv.crmstage;
    if (saved && list.some((s) => s.k === saved)) return saved;
    if (r.type === 'application') {
      const sp = (r.kv.stepprogress || '').toLowerCase();
      const ps = (r.kv.paymentstatus || '').toLowerCase();
      if (ps === 'verified') return 'review';
      if (sp === 'completed' || sp.includes('payment done') || r.kv.payment === 'Paid') return 'applied';
      return 'incomplete';
    }
    return list[0].k;
  }
  const stageMeta = (r) => (STAGES[r.type] || STAGES.lead).find((s) => s.k === r.stage) || { label: r.stage, tone: '' };

  /* Update (or add / remove) "Key: value" parts inside the pipe-delimited string */
  function setKV(raw, updates) {
    const parts = (raw || '').split(' | ');
    Object.keys(updates).forEach((key) => {
      const val = updates[key];
      const idx = parts.findIndex((p, i) => i > 0 && p.trim().toLowerCase().startsWith(key.toLowerCase() + ':'));
      if (val === null || val === undefined || val === '') { if (idx > -1) parts.splice(idx, 1); return; }
      const line = key + ': ' + String(val).replace(/ \| /g, ' / ');
      if (idx > -1) parts[idx] = line; else parts.push(line);
    });
    return parts.join(' | ');
  }

  async function saveRecord(rec, updates, okMsg) {
    if (!sb) { toast('Database not connected', true); return false; }
    const withMeta = Object.assign({}, updates, { CrmUpdated: new Date().toISOString(), CrmBy: encodeURIComponent(S.user.name) });
    const next = setKV(rec.raw, withMeta);
    try {
      const res = await sb.from('members').update({ college: next }).eq('id', rec.id).select('id');
      if (res.error) throw res.error;
      if (!res.data || !res.data.length) { toast('Not saved: the database rejected the update (permissions).', true); return false; }
      const idx = S.records.findIndex((r) => r.id === rec.id);
      const fresh = parseMember(Object.assign({}, S.records[idx].src, { college: next }));
      fresh.src = S.records[idx].src; fresh.src.college = next;
      S.records[idx] = fresh;
      toast(okMsg || 'Saved');
      return true;
    } catch (e) {
      toast('Save failed: ' + (e.message || e), true);
      return false;
    }
  }

  /* ------------------------------------------------------------------ *
   * Data loading
   * ------------------------------------------------------------------ */
  async function loadAll() {
    S.loaded = false; S.loadError = null; render();
    try {
      if (!sb) throw new Error('Could not load the database library. Check your connection and refresh.');
      let rows = [];
      const PAGE = 1000;
      for (let from = 0; ; from += PAGE) {
        const { data, error } = await sb.from('members').select('*').order('id', { ascending: true }).range(from, from + PAGE - 1);
        if (error) throw error;
        rows = rows.concat(data || []);
        if (!data || data.length < PAGE) break;
      }
      S.records = rows.map((m) => { const r = parseMember(m); r.src = m; return r; });
      try { const c = await fetch('chapters-data.json', { cache: 'no-cache' }); S.chapters = c.ok ? await c.json() : []; } catch (e) { S.chapters = []; }
      S.loaded = true;
    } catch (e) {
      S.loadError = e.message || String(e);
    }
    render();
  }

  /* ------------------------------------------------------------------ *
   * Selectors
   * ------------------------------------------------------------------ */
  const byType = (t) => S.records.filter((r) => r.type === t);
  const newestFirst = (a, b) => new Date(b.created || 0) - new Date(a.created || 0);
  function matchQ(r, q) {
    if (!q) return true;
    const hay = [r.name, r.email, r.phone, r.display, r.kv.venture, r.kv.firm, r.kv.company, r.kv.college, r.kv.chapterref, r.kv.expertise, r.kv.sectors].join(' ').toLowerCase();
    return q.toLowerCase().split(/\s+/).every((w) => hay.includes(w));
  }
  const appsFor = (cohort) => byType('application').filter((r) => cohort === 'all' || r.cohort === cohort);
  const cohortLabel = (c) => c === 'Spring02' ? 'Spring · Cohort 02' : c === 'Winter01' ? 'Winter · Cohort 01' : c;

  /* ------------------------------------------------------------------ *
   * Rendering: shell
   * ------------------------------------------------------------------ */
  function tabsDef() {
    const apps = appsFor('Spring02').length;
    return [
      { k: 'overview', label: 'Overview' },
      { k: 'apps', label: 'Applications', n: apps },
      { k: 'chapters', label: 'Chapters', n: S.chapters.length || '' },
      { k: 'network', label: 'Investors & mentors', n: byType('investor').length + byType('mentor').length },
      { k: 'people', label: 'All people', n: S.records.length }
    ];
  }
  function renderTabs() {
    $('tabs').innerHTML = tabsDef().map((t) =>
      '<button class="tab ' + (S.tab === t.k ? 'on' : '') + '" data-tab="' + t.k + '">' + esc(t.label) + (t.n !== undefined && t.n !== '' ? ' <span class="n">' + t.n + '</span>' : '') + '</button>'
    ).join('');
  }

  function render() {
    renderTabs();
    const v = $('view');
    if (S.loadError) { v.innerHTML = '<div class="panel"><div class="empty"><b>Could not load data</b><br>' + esc(S.loadError) + '<br><br><button class="btn" data-act="reload">Try again</button></div></div>'; return; }
    if (!S.loaded) { v.innerHTML = '<div class="loading">Loading…</div>'; return; }
    const views = { overview: viewOverview, apps: viewApps, chapters: viewChapters, network: viewNetwork, people: viewPeople };
    const keepFocus = document.activeElement && document.activeElement.id;
    const sel = keepFocus && document.activeElement.selectionStart;
    v.innerHTML = (views[S.tab] || viewOverview)() + '<div class="foot">Resource-reader analytics live in the <a href="data-legacy.html">legacy view</a>.</div>';
    if (keepFocus && $(keepFocus)) { const el = $(keepFocus); el.focus(); try { el.setSelectionRange(sel, sel); } catch (e) {} }
  }

  /* ------------------------------------------------------------------ *
   * Shared row renderers
   * ------------------------------------------------------------------ */
  function rowHTML(r) {
    const sm = stageMeta(r);
    let sub = '';
    if (r.type === 'application') sub = [r.kv.venture, r.display].filter(Boolean).join(' · ');
    else if (r.type === 'investor') sub = [r.kv.firm || r.display, r.kv.chequesize].filter(Boolean).join(' · ');
    else if (r.type === 'mentor') sub = [r.kv.company || r.display, clean(r.kv.expertise)].filter(Boolean).join(' · ');
    else sub = r.display || r.email;
    const pills = ['<span class="pill ' + sm.tone + '">' + esc(sm.label) + '</span>'];
    if (r.type === 'application') {
      if (S.perms.payments) {
        if (r.payment === 'verified') pills.push('<span class="pill green">Paid ✓</span>');
        else if (r.payment === 'claimed') pills.push('<span class="pill amber">Verify payment</span>');
      }
      if (r.score) pills.push('<span class="pill orange">★ ' + r.score + '</span>');
      if (r.hadWinter) pills.push('<span class="pill violet">Also in Winter</span>');
    }
    if (r.owner) pills.push('<span class="pill">👤 ' + esc(r.owner) + '</span>');
    if (r.notes.length) pills.push('<span class="pill">📝 ' + r.notes.length + '</span>');
    pills.push('<span class="ago">' + esc(ago(r.created)) + '</span>');
    return '<button class="row" data-open="' + r.id + '"><div class="avatar">' + esc(initials(r.name)) + '</div>' +
      '<div><div class="nm">' + esc(r.name) + '</div><div class="sub">' + esc(sub) + '</div></div>' +
      '<div class="meta">' + pills.join('') + '</div></button>';
  }
  const listHTML = (list, empty) => list.length ? '<div class="rows">' + list.map(rowHTML).join('') + '</div>' : '<div class="empty">' + esc(empty || 'Nothing here yet.') + '</div>';

  function stageChips(list, type, current, key) {
    const counts = {};
    list.forEach((r) => { counts[r.stage] = (counts[r.stage] || 0) + 1; });
    return '<div class="chips"><button class="fchip ' + (current === 'all' ? 'on' : '') + '" data-stage="' + key + ':all">All <i>' + list.length + '</i></button>' +
      STAGES[type].map((s) => '<button class="fchip ' + (current === s.k ? 'on' : '') + '" data-stage="' + key + ':' + s.k + '">' + esc(s.label) + ' <i>' + (counts[s.k] || 0) + '</i></button>').join('') + '</div>';
  }

  function exportBtn(label) {
    return S.perms.export ? '<button class="btn ghost sm" data-act="export">⬇ ' + esc(label || 'Export CSV') + '</button>' : '';
  }

                        : '<div class="stat"><span>To review</span><b>' + toReview.length + '</b><small>applied, awaiting review</small></div>') +

      '<div class="stat"><span>New mentors</span><b>' + newLeads[2] + '</b><small>' + byType('mentor').length + ' in network</small></div>' +

  /* ------------------------------------------------------------------ *
   * View: Applications
   * ------------------------------------------------------------------ */
  function filteredApps() {
    const A = S.app;
    let list = appsFor(A.cohort).filter((r) => matchQ(r, A.q));
    return list;
  }
  function viewApps() {
    const A = S.app;
    const all = appsFor(A.cohort).filter((r) => matchQ(r, A.q));
    let list = A.stage === 'all' ? all : all.filter((r) => r.stage === A.stage);
    if (A.sort === 'score') list = list.slice().sort((a, b) => b.score - a.score || newestFirst(a, b));
    else if (A.sort === 'name') list = list.slice().sort((a, b) => a.name.localeCompare(b.name));
    else list = list.slice().sort(newestFirst);
    const selected = all.filter((r) => r.stage === 'selected').length;
    const seats = A.cohort === 'Winter01' ? '' :
      '<div class="seats"><b>' + selected + ' / ' + SEATS + ' seats selected</b><div class="track"><div class="fill" style="width:' + Math.min(100, selected / SEATS * 100) + '%"></div></div><span class="ago">' + cohortLabel(A.cohort === 'all' ? 'Spring02' : A.cohort) + '</span></div>';
    return '<div class="page-h"><div><h2>Applications</h2><p>Review, score and select founders for each cohort.</p></div><div class="actions">' + exportBtn() + '</div></div>' +

      '<select class="in" id="appSort" style="max-width:160px"><option value="new"' + (A.sort === 'new' ? ' selected' : '') + '>Newest first</option><option value="score"' + (A.sort === 'score' ? ' selected' : '') + '>Highest score</option><option value="name"' + (A.sort === 'name' ? ' selected' : '') + '>Name A–Z</option></select></div>' +
      seats + stageChips(all, 'application', A.stage, 'app') +

  /* ------------------------------------------------------------------ *
   * Detail drawer
   * ------------------------------------------------------------------ */
  const HIDE_KEYS = new Set(['phone', 'source', 'fellowship', 'country', 'formsubmittedat', 'submittedat', 'paymentfee', 'prevcohort01', 'cohort', 'stepprogress', 'enrolled']);
  const LABELS = { venture: 'Venture', stage: 'Startup stage', teamsize: 'Team size', college: 'College', year: 'Year', course: 'Course', q1: 'Problem', q3: 'Traction / why', q4: 'Format', chapterref: 'Via chapter', paymentstatus: 'Payment status', payment: 'Payment', utr: 'UTR / reference', entitytype: 'Entity type', firm: 'Firm', chequesize: 'Cheque size', sectors: 'Sectors', engagement: 'Engagement', linkedin: 'LinkedIn', company: 'Company', role: 'Role', expertise: 'Expertise', exp: 'Experience', pastcompanies: 'Past companies', format: 'Format', commitment: 'Commitment', bio: 'Bio', notes: 'Notes', motivation: 'Motivation', refcode: 'Referral code', refby: 'Referred by', waiverrequested: 'Waiver asked', waiverreason: 'Waiver reason' };

  function detailKV(r) {
    const rows = [];
    if (r.display) rows.push(['Profile', esc(r.display)]);
    Object.keys(r.kv).forEach((k) => {
      if (HIDE_KEYS.has(k) || k.startsWith('crm')) return;
      if (!S.perms.payments && (k === 'utr' || k === 'paymentstatus' || k === 'payment')) return;
      const v = clean(r.kv[k]);
      if (!v) return;
      const label = LABELS[k] || k.replace(/^./, (c) => c.toUpperCase());
      const html = k === 'linkedin' ? '<a href="' + esc(v) + '" target="_blank" rel="noopener">' + esc(v) + '</a>' : esc(v);
      rows.push([label, html]);
    });
    return rows.map((x) => '<dt>' + esc(x[0]) + '</dt><dd>' + x[1] + '</dd>').join('');

  function waTemplate(r) {
    const n = first(r.name);
    if (r.type === 'application' && r.stage === 'incomplete') return 'Hi ' + n + ', this is the Future Council team. You started your Launchpad application but did not finish it. Need any help completing it? The Spring Cohort is open.';
    if (r.type === 'application') return 'Hi ' + n + ', this is the Future Council team about your Launchpad application' + (r.kv.venture ? ' for ' + r.kv.venture : '') + '.';

        (S.perms.verify && r.payment === 'claimed' ? '<button class="btn sm orange" data-act="verify">Mark payment verified</button>' : '') +
        (S.perms.verify && r.payment === 'verified' ? '<button class="btn ghost sm" data-act="unverify">Undo</button>' : '') + '</div>' +
        (r.kv.utr ? '<p style="margin:8px 0 0;font-size:13px;color:var(--soft)">Reference: ' + esc(r.kv.utr) + '</p>' : '') + '</div>';
    }
    const scoreBlock = r.type === 'application' ? '<div class="blk"><h4>Score</h4><div class="stars">' + [1, 2, 3, 4, 5].map((n) => '<button class="' + (r.score >= n ? 'on' : '') + '" data-score="' + n + '" aria-label="' + n + ' stars">★</button>').join('') + (r.score ? '<button class="btn ghost sm" data-score="0" style="margin-left:8px">Clear</button>' : '') + '</div></div>' : '';

    $('overlay').innerHTML = '<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-label="' + esc(r.name) + '">' +
      '<div class="d-h"><div><h2>' + esc(r.name) + '</h2><div class="meta" style="margin-top:6px"><span class="pill ' + sm.tone + '">' + esc(sm.label) + '</span><span class="pill">' + TYPE_LABEL[r.type] + '</span>' +
      (r.cohort ? '<span class="pill blue">' + esc(cohortLabel(r.cohort)) + '</span>' : '') + '<span class="ago">' + esc(ago(r.created)) + '</span></div></div><button class="x" data-act="close" aria-label="Close">×</button></div>' +
      '<div class="d-b">' +
      '<div class="blk"><h4>Contact</h4><div class="contact">' +
      (wa ? '<a class="btn sm" href="' + esc(wa) + '" target="_blank" rel="noopener">WhatsApp</a>' : '') +
      (r.phone ? '<a class="btn ghost sm" href="tel:' + esc(r.phone) + '">Call ' + esc(r.phone) + '</a>' : '') +
      (r.email ? '<a class="btn ghost sm" href="mailto:' + esc(r.email) + '">Email</a>' : '') +
      (!wa && !r.phone && !r.email ? '<span class="ago">No contact details.</span>' : '') + '</div>' +
      (r.email ? '<p style="margin:10px 0 0;font-size:13px;color:var(--soft);overflow-wrap:anywhere">' + esc(r.email) + '</p>' : '') + '</div>' +
      '<div class="blk"><h4>Stage</h4><div class="stagepick">' + stages.map((s) => '<button class="' + (r.stage === s.k ? 'on' : '') + '" data-setstage="' + s.k + '"' + (s.decide && !S.perms.decide ? ' disabled title="Needs manager access"' : '') + '>' + esc(s.label) + '</button>').join('') + '</div></div>' +
      payBlock + scoreBlock +
      '<div class="blk"><h4>Owner</h4><select class="in" id="ownerSel">' + ownerOpts + '</select>' +
      (r.updatedBy ? '<p style="margin:8px 0 0;font-size:12px;color:var(--faint)">Last updated by ' + esc(r.updatedBy) + (r.updated ? ' · ' + esc(ago(r.updated)) : '') + '</p>' : '') + '</div>' +
      '<div class="blk"><h4>Notes</h4><div class="notes">' +
      (r.notes.length ? r.notes.map((n) => { const m = n.match(/^\[(.+?)\]\s*([\s\S]*)$/); return '<div class="note">' + (m ? '<small>' + esc(m[1]) + '</small>' + esc(m[2]) : esc(n)) + '</div>'; }).join('') : '<div class="ago">No notes yet.</div>') +
      '</div><textarea class="in" id="noteIn" placeholder="Add a note for the team…"></textarea><div style="margin-top:8px"><button class="btn sm" data-act="addnote">Add note</button></div></div>' +
      '<div class="blk"><h4>Details</h4>' + (detailKV(r) ? '<dl class="kv">' + detailKV(r) + '</dl>' : '<div class="ago">No extra details.</div>') +
      (r.hadWinter ? '<p style="margin:10px 0 0;font-size:13px;color:var(--violet)">This person also applied to the Winter cohort. Their earlier answers are archived in this record.</p>' : '') + '</div>' +
      '</div></aside>';
    document.body.style.overflow = 'hidden';
  }
  function closeDrawer() { S.openId = null; $('overlay').innerHTML = ''; document.body.style.overflow = ''; }
  function refreshDrawer() { if (S.openId != null) { const top = document.querySelector('.d-b'); const y = top ? top.scrollTop : 0; openDrawer(S.openId); const nb = document.querySelector('.d-b'); if (nb) nb.scrollTop = y; } render(); }

  /* ------------------------------------------------------------------ *
   * Actions
   * ------------------------------------------------------------------ */
  const cur = () => S.records.find((x) => x.id === S.openId);

  async function setStage(k) {
    const r = cur(); if (!r) return;
    const meta = (STAGES[r.type] || []).find((s) => s.k === k);
    if (meta && meta.decide && !S.perms.decide) { toast('Needs manager access', true); return; }
    if (await saveRecord(r, { CrmStage: k }, 'Stage → ' + meta.label)) refreshDrawer();
  }
  async function setScore(n) { const r = cur(); if (r && await saveRecord(r, { CrmScore: n || '' }, n ? 'Score saved' : 'Score cleared')) refreshDrawer(); }
  async function setOwner(v) { const r = cur(); if (r && await saveRecord(r, { CrmOwner: v ? encodeURIComponent(v) : '' }, 'Owner updated')) refreshDrawer(); }
  async function addNote() {
    const r = cur(); const el = $('noteIn'); if (!r || !el) return;
    const text = el.value.trim(); if (!text) return;
    const stamp = new Date().toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
    const line = '[' + S.user.name + ' · ' + stamp + '] ' + text.replace(/\n+/g, ' ');
    const next = r.notes.concat([line]).join('\n');
    if (next.length > 3500) { toast('Notes are full for this person. Keep it short.', true); return; }
    if (await saveRecord(r, { CrmNote: encodeURIComponent(next) }, 'Note added')) refreshDrawer();
  }
  async function setVerified(on) {
    const r = cur(); if (!r || !S.perms.verify) return;
    const ok = await saveRecord(r, on ? { PaymentStatus: 'verified', Payment: 'Paid' } : { PaymentStatus: 'pending_verification' }, on ? 'Payment verified' : 'Verification undone');
    if (ok) refreshDrawer();
  }

  function currentExportRows() {
    let list, name;
    if (S.tab === 'apps') { list = filteredApps().filter((r) => S.app.stage === 'all' || r.stage === S.app.stage); name = 'applications'; }
    else if (S.tab === 'chapters') { list = byType('chapterlead'); name = 'chapter-leads'; }
    else if (S.tab === 'network') { list = byType(S.net.kind).filter((r) => matchQ(r, S.net.q)); name = S.net.kind + 's'; }
    else { list = S.records.filter((r) => (S.people.type === 'all' || r.type === S.people.type) && matchQ(r, S.people.q)); name = 'people'; }
    return { list, name };
  }
  function exportCSV() {
    if (!S.perms.export) return;
    const { list, name } = currentExportRows();
    const cols = ['Name', 'Email', 'Phone', 'Type', 'Cohort', 'Stage', 'Owner', 'Score', 'Payment', 'Profile', 'Venture', 'Firm / company', 'Created'];
    const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const rows = list.map((r) => [r.name, r.email, r.phone, TYPE_LABEL[r.type], r.cohort ? cohortLabel(r.cohort) : '', stageMeta(r).label, r.owner, r.score || '', r.payment, r.display, r.kv.venture || '', r.kv.firm || r.kv.company || '', r.created].map(q).join(','));
    const blob = new Blob(['﻿' + [cols.map(q).join(',')].concat(rows).join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'tfc-' + name + '-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }
  /* ------------------------------------------------------------------ *
   * Events (delegated)
   * ------------------------------------------------------------------ */
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-tab],[data-open],[data-stage],[data-cohort],[data-kind],[data-act],[data-setstage],[data-score]');
    if (!t) return;
    if (t.dataset.tab) { S.tab = t.dataset.tab; closeDrawer(); render(); window.scrollTo(0, 0); }
    else if (t.dataset.open) openDrawer(Number(t.dataset.open) || t.dataset.open);
    else if (t.dataset.stage) { const [k, v] = t.dataset.stage.split(':'); ({ app: S.app, chap: S.chap, net: S.net })[k].stage = v; render(); }
    else if (t.dataset.cohort) { S.app.cohort = t.dataset.cohort; S.app.stage = 'all'; render(); }
    else if (t.dataset.kind) { S.net.kind = t.dataset.kind; S.net.stage = 'all'; render(); }
    else if (t.dataset.setstage) setStage(t.dataset.setstage);
    else if (t.dataset.score !== undefined) setScore(parseInt(t.dataset.score, 10));
    else if (t.dataset.act === 'close') closeDrawer();
    else if (t.dataset.act === 'export') exportCSV();
    else if (t.dataset.act === 'reload') loadAll();
    else if (t.dataset.act === 'addnote') addNote();
    else if (t.dataset.act === 'verify') setVerified(true);
    else if (t.dataset.act === 'unverify') setVerified(false);
  });
  document.addEventListener('input', (e) => {
    const id = e.target.id;
    if (id === 'appQ') { S.app.q = e.target.value; render(); }
    else if (id === 'chapQ') { S.chap.q = e.target.value; render(); }
    else if (id === 'netQ') { S.net.q = e.target.value; render(); }
    else if (id === 'pplQ') { S.people.q = e.target.value; render(); }
  });
  document.addEventListener('change', (e) => {
    const id = e.target.id;
    if (id === 'appSort') { S.app.sort = e.target.value; render(); }
    else if (id === 'pplType') { S.people.type = e.target.value; render(); }
    else if (id === 'ownerSel') setOwner(e.target.value);
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.openId != null) closeDrawer(); });

  /* ------------------------------------------------------------------ *
   * Auth
   * ------------------------------------------------------------------ */
  function startSession(user) {
    S.user = user; S.perms = PERMS[user.role] || PERMS.intern;
    $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden');
    $('whoLabel').innerHTML = '<b>' + esc(user.name) + '</b> · ' + esc(user.role);
    loadAll();
  }
  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const u = $('lu').value.trim().toLowerCase();
    const p = $('lp').value;
    const staff = STAFF.find((s) => s.u === u || (s.alias || []).includes(u));
    let ok = false;
    try { ok = !!staff && (await sha256('tfc-crm-v2:' + staff.u + ':' + p)) === staff.hash; } catch (err) { ok = false; }
    if (ok) {
      try { sessionStorage.setItem(SESSION_KEY, JSON.stringify({ u: staff.u })); } catch (err) {}
      $('loginErr').classList.add('hidden'); $('lp').value = '';
      startSession(staff);
    } else { $('loginErr').classList.remove('hidden'); }
  });
  $('btnLogout').addEventListener('click', () => { try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {} location.reload(); });
  $('btnRefresh').addEventListener('click', loadAll);

  try {
    const saved = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null');
    const staff = saved && STAFF.find((s) => s.u === saved.u);
    if (staff) startSession(staff);
  } catch (e) {}
})();
</script>
</body>
</html>
